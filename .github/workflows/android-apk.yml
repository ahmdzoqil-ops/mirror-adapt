name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build web assets (static, for Capacitor)
        run: bun run build:mobile

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "store_password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            # لا يوجد مفتاح في الأسرار — ننشئ مفتاحًا مؤقتًا حتى ينتج APK قابل للتثبيت
            keytool -genkeypair -v -keystore android/keystore/release.jks \
              -alias daftari -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass daftari123 -keypass daftari123 \
              -dname "CN=Daftari, OU=App, O=Daftari, L=NA, S=NA, C=SA"
            echo "store_password=daftari123" >> $GITHUB_OUTPUT
            echo "key_alias=daftari" >> $GITHUB_OUTPUT
            echo "key_password=daftari123" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK (signed)
        working-directory: android
        env:
          DAFTARI_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/release.jks
          DAFTARI_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          DAFTARI_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          DAFTARI_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daftari-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: daftari-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
